<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduGenie – Gemini Powered Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="hero">
    <h1>🎓 EduGenie</h1>
    <p>Your Gemini-powered learning assistant</p>
  </header>

  <main class="card">
    <label for="task">Choose a task</label>
    <select id="task">
      <option value="qa">❓ Ask a Question (Q&amp;A)</option>
      <option value="explain">💡 Explain a Concept</option>
      <option value="quiz">📝 Generate Quiz</option>
      <option value="summarize">📄 Summarize Text</option>
      <option value="recommend">🗺️ Learning Path</option>
    </select>

    <label for="input" id="input-label">Your question</label>
    <textarea id="input" rows="6" placeholder="Which is the largest ocean?"></textarea>

    <button id="submit">Submit</button>

    <div id="loader" class="loader hidden">Thinking…</div>
    <div id="error" class="error hidden"></div>
    <div id="result" class="result hidden"></div>
  </main>

  <footer>EduGenie • FastAPI + Google Gemini</footer>
  <script src="/static/script.js"></script>
</body>
</html>
